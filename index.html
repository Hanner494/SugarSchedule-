<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Stundenplan – Cozy Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bubbly Font -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">Cozy Planner 🌿</div>
    <div class="now">
      <span id="todayDate">–</span>
      <span class="sep">•</span>
      <span id="nowTime">–:–:–</span>
    </div>
    <div class="actions">
      <button id="btnEditTimes" class="btn">Zeiten bearbeiten</button>
      <button id="btnAddLesson" class="btn">+ Stunde</button>
      <button id="btnReset" class="btn btn-danger">Zurücksetzen</button>
    </div>
  </header>

  <main class="app-main">

    <aside class="side-panel">
      <section class="plant-card">
        <h3>Ferien-Pflanze</h3>
        <label class="inline">
          Ferienbeginn:
          <input type="date" id="vacationDate" />
        </label>
        <div class="plant-wrap">
          <div class="plant">
            <div class="stem" id="plantStem"></div>
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>
            <div class="flower" id="plantFlower">🌸</div>
            <div class="pot">
              <div class="pot-lip"></div>
            </div>
            <div class="sparkle s1">✧</div>
            <div class="sparkle s2">✦</div>
            <div class="sparkle s3">✧</div>
          </div>
        </div>
        <div class="countdown">
          Noch <span id="daysToVacation">–</span> Tage bis zu den Ferien 🏖️
        </div>
      </section>

      <section class="sticker-card">
        <h3>Sticker</h3>
        <p class="hint">Ziehe Sticker auf eine Stunde</p>
        <div id="stickerShelf" class="sticker-shelf">
          <div class="sticker" draggable="true">🎉</div>
          <div class="sticker" draggable="true">🏆</div>
          <div class="sticker" draggable="true">📣</div>
          <div class="sticker" draggable="true">🎂</div>
          <div class="sticker" draggable="true">⭐</div>
          <div class="sticker" draggable="true">🎈</div>
          <div class="sticker" draggable="true">📚</div>
          <div class="sticker" draggable="true">🧪</div>
        </div>
      </section>
    </aside>

    <section class="timetable">
      <div class="week-header">
        <div class="title">Dein Stundenplan</div>
      </div>

      <div class="grid" id="grid">
        <!-- Kopfzeile -->
        <div class="cell cell--head cell--time">Zeit</div>
        <div class="cell cell--head">Mo</div>
        <div class="cell cell--head">Di</div>
        <div class="cell cell--head">Mi</div>
        <div class="cell cell--head">Do</div>
        <div class="cell cell--head">Fr</div>
        <!-- Zeilen werden von app.js generiert -->
      </div>
    </section>
  </main>

  <!-- Modal: Stunde bearbeiten -->
  <div class="modal hidden" id="editModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h2>Stunde bearbeiten</h2>

      <div class="form-grid">
        <label>
          Fach
          <input id="inpSubject" placeholder="z. B. Mathe" />
        </label>
        <label>
          Lehrer:in
          <input id="inpTeacher" placeholder="z. B. Frau Müller" />
        </label>
        <label>
          Raum
          <input id="inpRoom" placeholder="z. B. 201" />
        </label>
        <label>
          Status
          <select id="inpStatus">
            <option value="normal">Normal</option>
            <option value="substitute">Vertretung</option>
            <option value="canceled">Ausfall</option>
          </select>
        </label>
        <label class="inline">
          <input type="checkbox" id="inpHasTest" />
          Test/Klausur 📝
        </label>
      </div>

      <div class="modal-actions">
        <button id="btnSaveEdit" class="btn">Speichern</button>
        <button id="btnDelete" class="btn btn-danger">Löschen</button>
        <button id="btnCloseEdit" class="btn btn-light">Schließen</button>
      </div>
    </div>
  </div>

  <!-- Modal: Zeiten bearbeiten -->
  <div class="modal hidden" id="timesModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h2>Stundenzeiten bearbeiten</h2>
      <div id="timesEditor"></div>
      <div class="modal-actions">
        <button id="btnTimesAdd" class="btn btn-light">+ Zeile</button>
        <button id="btnTimesSave" class="btn">Speichern</button>
        <button id="btnTimesCancel" class="btn btn-light">Abbrechen</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
