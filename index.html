<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Y2K Mint-Braun Finanzplaner (Mobile)</title>
    <link rel="stylesheet" href="styles.css" />
    <meta name="theme-color" content="#0e7a6b" />
  </head>
  <body>
    <header class="header">
      <div class="header-row">
        <h1 class="app-title">Finanzplaner</h1>
        <button id="resetBtn" class="icon-btn danger" title="Alles zurücksetzen">⟲</button>
      </div>
      <div class="controls">
        <label class="control">
          <span>Datum</span>
          <input id="globalDate" type="date" />
        </label>
        <button id="todayBtn" class="btn pill">Heute</button>
      </div>
      <div class="summary">
        <div class="sum-box">
          <div class="sum-label">Gesamtsaldo</div>
          <div id="grandTotal" class="sum-value">0,00 €</div>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="board" role="tab" aria-selected="true">Board</button>
        <button class="tab" data-tab="add" role="tab" aria-selected="false">Hinzufügen</button>
        <button class="tab" data-tab="stickers" role="tab" aria-selected="false">Sticker</button>
      </div>
    </header>

    <main class="main">
      <!-- Board (Kategorien als Sektionen) -->
      <section id="tab-board" class="tab-page active" aria-labelledby="Board">
        <div id="categories" class="categories">
          <!-- Kategorien werden per JS gerendert -->
        </div>
      </section>

      <!-- Hinzufügen -->
      <section id="tab-add" class="tab-page" aria-labelledby="Hinzufügen">
        <form id="entryForm" class="card form-card">
          <h2>Neuen Eintrag</h2>

          <label class="field">
            <span>Kategorie</span>
            <select id="categorySelect" required></select>
          </label>

          <div class="row">
            <label class="field">
              <span>Art</span>
              <select id="typeSelect" required>
                <option value="income">Einnahme (+)</option>
                <option value="expense">Ausgabe (−)</option>
              </select>
            </label>
            <label class="field">
              <span>Betrag (€)</span>
              <input id="amountInput" type="number" step="0.01" min="0" placeholder="0.00" required />
            </label>
          </div>

          <div class="row">
            <label class="field">
              <span>Datum</span>
              <input id="dateInput" type="date" />
            </label>
            <label class="field">
              <span>Notiz</span>
              <input id="noteInput" type="text" placeholder="z.B. Kino, Tanken, Bonus..." />
            </label>
          </div>

          <button type="submit" class="btn primary full">Hinzufügen</button>
        </form>
      </section>

      <!-- Sticker Palette -->
      <section id="tab-stickers" class="tab-page" aria-labelledby="Sticker">
        <div class="card">
          <h2>Sticker Palette (ziehen & ablegen)</h2>
          <div id="stickerPalette" class="sticker-palette">
            <!-- Sticker per JS -->
          </div>
          <p class="hint">Sticker auf eine Karte ziehen, um ihn hinzuzufügen. Auf eine Kategorie ziehen, um alle Karten darin zu taggen.</p>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="board" title="Board">🗂️</button>
      <button class="nav-btn" data-tab="add" title="Hinzufügen">➕</button>
      <button class="nav-btn" data-tab="stickers" title="Sticker">⭐</button>
    </nav>

    <!-- Templates -->
    <template id="categoryTemplate">
      <section class="category card">
        <div class="category-head">
          <div class="title-wrap">
            <h3 class="category-title"></h3>
            <div class="badge-sum">Summe: <span class="category-sum">0,00 €</span></div>
          </div>
          <button class="icon-btn collapse-btn" title="Einklappen">▾</button>
        </div>
        <div class="drop-zone entries"></div>
      </section>
    </template>

    <template id="entryTemplate">
      <article class="entry" draggable="true">
        <div class="entry-top">
          <div class="chip kind">+ Einnahme</div>
          <div class="amount">+0,00 €</div>
        </div>
        <div class="entry-mid">
          <div class="note">—</div>
          <div class="date">—</div>
        </div>
        <div class="entry-stickers"></div>
        <div class="entry-actions">
          <button class="icon-btn small edit" title="Bearbeiten">✎</button>
          <button class="icon-btn small delete" title="Löschen">✕</button>
        </div>
      </article>
    </template>

    <template id="stickerChipTemplate">
      <span class="sticker-chip" draggable="true">
        <span class="emoji">⭐</span>
        <button class="remove-sticker" title="Sticker entfernen">×</button>
      </span>
    </template>

    <script src="script.js"></script>
  </body>
</html>
