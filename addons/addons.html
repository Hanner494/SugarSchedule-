<!-- Referenz-Struktur: Wird per JS erzeugt -->
<section class="addons-panel">
  <div class="addons-group">
    <h3>Optik-Extras</h3>
    <label class="toggle">
      <input type="checkbox" id="toggleBows" checked />
      Schleifen (Bows) anzeigen
    </label>
    <label class="toggle">
      <input type="checkbox" id="toggleSparkle" checked />
      Sparkle-Animationen
    </label>
  </div>

  <div class="addons-group">
    <h3>Stundenzeiten</h3>
    <button id="btnEditTimes">Zeiten bearbeiten</button>
  </div>

  <div class="addons-group plant-group">
    <h3>Ferien‑Pflanze</h3>
    <label>
      Ferienbeginn (Datum)
      <input type="date" id="vacationDate"/>
    </label>
    <div class="plant">
      <div class="pot"></div>
      <div class="stem" id="plantStem"></div>
      <div class="leaf leaf--left"></div>
      <div class="leaf leaf--right"></div>
      <div class="bud" id="plantBud">🌸</div>
    </div>
    <small class="plant-hint">Die Pflanze wächst, je näher der Ferienbeginn ist.</small>
  </div>
</section>

<!-- Modal für Zeiten -->
<div class="modal hidden" id="timesModal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <h2>Stundenzeiten bearbeiten</h2>
    <div id="timesEditor"></div>
    <div class="modal-actions">
      <button id="btnTimesAdd">+ Zeile</button>
      <button id="btnTimesSave">Speichern</button>
      <button id="btnTimesCancel">Abbrechen</button>
    </div>
  </div>
</div>
